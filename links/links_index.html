<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MKJAPAN｜Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans JP', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a1a2e;
  overflow-x: hidden;
}

/* 背景画像 */
.bg {
  position: fixed;
  inset: 0;
  background: url('bg.jpg') center center / cover no-repeat;
  z-index: 0;
}
.bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(10, 26, 46, 0.45) 0%,
    rgba(10, 26, 46, 0.35) 40%,
    rgba(10, 26, 46, 0.55) 100%
  );
}

/* コンテナ */
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: 40px 20px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}

/* ヘッダー */
.header {
  text-align: center;
  margin-bottom: 36px;
  animation: fadeDown 0.8s ease both;
}
.logo {
  font-family: 'Noto Serif JP', serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: .14em;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.logo span {
  color: #EDD98A;
}
.tagline {
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: .2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.6);
}

/* リンクカード */
.links {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.link-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 16px;
  padding: 20px 22px;
  color: #fff;
  text-decoration: none;
  transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  animation: fadeUp 0.7s ease both;
  box-shadow: 0 4px 24px rgba(0,0,0,0.12);
}
.link-card:nth-child(1) { animation-delay: 0.1s; }
.link-card:nth-child(2) { animation-delay: 0.22s; }
.link-card:nth-child(3) { animation-delay: 0.34s; }

.link-card:hover {
  transform: translateY(-3px);
  background: rgba(255, 255, 255, 0.22);
  box-shadow: 0 8px 32px rgba(0,0,0,0.18);
}
.link-card:active {
  transform: translateY(0);
}

.link-info {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.link-name {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  letter-spacing: .03em;
}
.link-desc {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
}
.link-arrow {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border: 1.5px solid rgba(255,255,255,0.4);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  color: rgba(255,255,255,0.8);
  transition: border-color 0.2s, color 0.2s;
}
.link-card:hover .link-arrow {
  border-color: #EDD98A;
  color: #EDD98A;
}

/* コピーライト */
.copy {
  margin-top: 32px;
  font-size: 11px;
  color: rgba(255,255,255,0.35);
  letter-spacing: .06em;
  animation: fadeUp 0.7s ease 0.5s both;
}

/* アニメーション */
@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-16px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">
  <div class="header">
    <div class="logo font-serif">MK<span>JAPAN</span></div>
    <div class="tagline">Official Links</div>
  </div>

  <div class="links">
    <a class="link-card" href="https://coconala.com/users/2155070" target="_blank" rel="noopener">
      <div class="link-info">
        <span class="link-name">ココナラ</span>
        <span class="link-desc">サービス出品ページ</span>
      </div>
      <span class="link-arrow">↗</span>
    </a>

    <a class="link-card" href="https://www.amazon.co.jp/stores/author/B0FDLCRY8S" target="_blank" rel="noopener">
      <div class="link-info">
        <span class="link-name">Amazon Kindle</span>
        <span class="link-desc">著者ページ</span>
      </div>
      <span class="link-arrow">↗</span>
    </a>

    <a class="link-card" href="https://note.com/masatomo_fx" target="_blank" rel="noopener">
      <div class="link-info">
        <span class="link-name">note</span>
        <span class="link-desc">masatomo_fx</span>
      </div>
      <span class="link-arrow">↗</span>
    </a>
  </div>

  <p class="copy">&copy; 2026 MKJAPAN Co.,Ltd.</p>
</div>

</body>
</html>
